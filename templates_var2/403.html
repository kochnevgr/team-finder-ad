{% extends 'base.html' %}

{% block title %}Нет доступа{% endblock %}

{% block content %}
<div class="error-page">
    <h1>Нет доступа</h1>
    <p>Эта страница доступна только автору. Если это ваш проект, войдите под своим аккаунтом.</p>
    <a href="/projects/list/" class="black-button">На главную</a>
    {% if not request.user.is_authenticated %}
    <a href="/users/login/" class="outline-button">Войти</a>
    {% endif %}
</div>
{% endblock %}
